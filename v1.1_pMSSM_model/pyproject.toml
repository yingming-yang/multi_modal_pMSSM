[project]
dependencies = []
name = "v1.1_pMSSM_model"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
v1_1_pMSSM_model = { path = ".", editable = true }

[tool.pixi.dependencies]
lal = "*"
lalsimulation = "*"
numpy = ">=1.26.1,<2.0"
matplotlib = "*"
pandas = "*"
pytorch = "2.4.0.*"
corner = ">=2.2.3,<3"
python = "3.11.*"
ipykernel = ">=7.2.0,<8"
jupyter = ">=1.1.1,<2"
torchvision = "0.19.0.*"
pytorch-cuda = "12.4.*"
glasflow = ">=0.4.1,<0.5"
torchdiffeq = ">=0.2.2,<0.3"
scipy = ">=1.17.1,<2"
scikit-learn = ">=1.8.0,<2"
uproot = ">=5.7.3,<6"
awkward = ">=2.9.0,<3"
pip = ">=26.0.1,<27"
pyyaml = ">=6.0.3,<7"

[tool.pixi.tasks]
