# Hyperparameters for conditional normalizing flow training.
# Pass this file to v1.1_norm_flow.py via --config.

# Flow architecture
num_flow_steps: 10
hidden_dim: 512
num_transform_blocks: 2
batch_norm: false
base_transform_type: "rq-coupling"   # options: "rq-coupling", "maf"
num_bins: 8                          # only used when base_transform_type == "rq-coupling"

# Optimizer
learning_rate: 1.0e-5
weight_decay: 1.0e-5

# Training
data_folder: "/ptmp/yinya/gen_flat_28346825/ntuples"
num_epochs: 1000
data_fraction: 1     # fraction of total data to use; set < 1 for test runs
train_fraction: 0.8  # fraction of used data for training, rest goes to test
batch_size: 64

# Output
doc_folder: "/u/yinya/workspace/multi_modal_pMSSM/v1.1_pMSSM_model/normalizing_flow"
